<style>
:root{--bg:#eefaff;--card:#fff;--ink:#18324a;--muted:#70879a;--primary:#0db5b5;--gold:#f6b91a;--green:#37b96b;--red:#f15b67;--blue:#4d9de0;--shadow:0 10px 30px #173a4a18}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#effcff,#f9fbff);font-family:"Tahoma","Arial",sans-serif;color:var(--ink)}
button,input,select{font:inherit}button{border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid #dcebf2;padding:12px 20px}
.toprow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand h1{margin:0;font-size:25px}.credit{color:#8a6a2a;font-weight:800;font-size:13px;margin-top:4px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill, .btn{border:1px solid #d6e7ef;background:#fff;border-radius:15px;padding:9px 13px;color:var(--ink);font-weight:800}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn.gold{background:#fff5d1;border-color:#f7d879}.btn.danger{background:#fff0f1;border-color:#ffc7cb;color:#c63b46}.btn:active{transform:translateY(1px)}
nav{display:flex;gap:7px;overflow:auto;padding-top:10px}.navbtn{padding:10px 13px;border-radius:13px;background:#f5fbfd;color:#46677d;font-weight:800;white-space:nowrap}.navbtn.active{background:#dff9f7;color:#008e8c}
main{max-width:1450px;margin:auto;padding:20px}.hero{background:linear-gradient(120deg,#dffaf8,#f4f8ff);border:1px solid #cfecef;border-radius:30px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}.heroGrid{display:grid;grid-template-columns:1fr 2fr;gap:20px;align-items:center}.hero h2{font-size:32px;margin:0 0 8px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fff;border-radius:18px;padding:12px 18px;min-width:115px;text-align:center;box-shadow:0 4px 15px #173a4a0c}.stat b{font-size:23px;display:block}.progress{height:18px;background:#dceff6;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#19b5b0,#79d9a0);transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}.student{background:#fff;border:1px solid #dbeaf0;border-radius:25px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}.avatar{width:76px;height:76px;border-radius:50%;background:#def7fb;display:grid;place-items:center;font-size:48px;margin:auto}.name{text-align:center;font-size:20px;font-weight:900;margin-top:8px}.level{text-align:center;color:var(--muted);font-size:13px}.badgeRow{display:flex;justify-content:center;gap:6px;margin:8px 0}.badge{background:#fff4ce;border-radius:999px;padding:5px 10px;font-weight:900}.meter{height:8px;background:#e8f1f5;border-radius:99px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:#0db5b5;width:0}.actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:7px}.face{padding:10px 5px;border-radius:13px;font-size:14px;font-weight:900}.good{background:#e7f9ed;color:#17713d}.bad{background:#ffeaec;color:#bf3543}.star{background:#fff3cf;color:#9a6a00}.absent{background:#eef1f4;color:#596773}.statusBadge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 9px;font-weight:900;font-size:12px}.statusGood{background:#e7f9ed;color:#17713d}.statusBad{background:#ffeaec;color:#bf3543}.statusAbsent{background:#eef1f4;color:#596773}.statusNeutral{background:#f4f7f9;color:#70879a}.history{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;min-height:25px}.mini{font-size:18px}.panel{background:#fff;border:1px solid #dcebf2;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:15px}.panel h3{margin-top:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #d5e5ec;border-radius:12px;padding:10px;background:#fff;min-width:150px}
.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px;border-bottom:1px solid #edf2f5;text-align:right}.table th{background:#f5fbfd}
.modal{position:fixed;inset:0;background:#18324a66;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.show{display:flex}.modalbox{background:white;border-radius:25px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modalbox h3{margin-top:0}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{padding:11px;border:1px solid #d5e5ec;border-radius:12px}
.toast{position:fixed;left:20px;bottom:20px;background:#18324a;color:white;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);display:none;z-index:100}.toast.show{display:block;animation:pop .2s ease}
.celebrate{position:fixed;inset:0;pointer-events:none;display:none;z-index:80}.celebrate.show{display:block}.conf{position:absolute;font-size:32px;animation:fall 1.5s ease-out forwards}
@keyframes fall{from{transform:translateY(-20vh) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(600deg);opacity:0}}@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:scale(1);opacity:1}}
.empty{text-align:center;padding:35px;color:var(--muted)}.muted{color:var(--muted)}.rank{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rankCard{padding:18px;border-radius:22px;background:linear-gradient(180deg,#fff,#f4fbfd);text-align:center;border:1px solid #deedf3}.rankCard .big{font-size:42px}.switch{display:flex;align-items:center;gap:8px}.small{font-size:12px}.footer{text-align:center;color:#8a9cab;padding:20px}
@media(max-width:800px){.heroGrid{grid-template-columns:1fr}.hero h2{font-size:25px}.rank{grid-template-columns:1fr}.top{position:relative}main{padding:12px}}
@media print{.top,nav,.toolbar,.actions,.noPrint{display:none!important}.panel,.hero,.student{box-shadow:none;border:1px solid #ccc}.student{break-inside:avoid}.footer{display:block}}
</style>
<style>
#cloudLogin{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#effcff,#f9fbff);display:flex;align-items:center;justify-content:center;padding:20px}
.loginCard{width:min(430px,100%);background:#fff;border:1px solid #dcebf2;border-radius:28px;padding:30px;box-shadow:0 20px 60px #173a4a20;text-align:center}.loginCard h2{margin:0 0 8px}.loginCard p{color:#70879a;margin:0 0 22px}.loginCard input{width:100%;padding:13px;border:1px solid #d6e7ef;border-radius:14px;margin:6px 0;direction:ltr;text-align:left}.loginCard button{width:100%;margin-top:10px}.cloudStatus{font-size:12px;color:#70879a;margin-top:12px}.logoutBtn{font-size:12px;padding:6px 10px;border-radius:10px;background:#fff;border:1px solid #d6e7ef}
</style></head>
<body>
<div id="cloudLogin">
  <div class="loginCard">
    <div style="font-size:54px">🦸‍♀️</div>
    <h2>أبطال السلوك</h2>
    <p>سجّلي الدخول لحفظ بياناتك ومزامنتها بين أجهزتك ☁️</p>
    <input id="authEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="authPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="btn prim" onclick="cloudSignIn()">دخول</button>
    <button class="btn" onclick="cloudSignUp()">إنشاء حساب جديد</button>
    <div id="authMsg" class="cloudStatus"></div>
  </div>
</div>
<header class="top">
  <div class="toprow">
    <div class="brand"><h1>🏆 أبطال السلوك</h1><div class="credit">✦ تصميم نوال الجهني ✦</div><div style="display:flex;gap:8px;align-items:center;margin-top:5px"><span id="cloudBadge" class="cloudStatus">☁️ غير متصل</span><button class="logoutBtn" onclick="cloudSignOut()">تسجيل الخروج</button></div></div>
    <div class="controls">
      <select id="classSelect" class="pill"></select>
      <select id="lessonSelect" class="pill"></select>
      <button class="btn" onclick="openModal('lesson')">＋ حصة</button>
      <button class="btn" onclick="toggleSound()">🔊 الصوت</button>
      <button class="btn primary" onclick="showScreen('students')">🖥️ شاشة الفصل</button>
    </div>
  </div>
  <nav>
    <button class="navbtn active" data-screen="students" onclick="showScreen('students')">🏠 الرئيسية</button>
    <button class="navbtn" data-screen="manage" onclick="showScreen('manage')">👩‍🏫 الفصول والطلاب</button>
    <button class="navbtn" data-screen="honor" onclick="showScreen('honor')">🏆 لوحة الشرف</button>
    <button class="navbtn" data-screen="prizes" onclick="showScreen('prizes')">🎁 الجوائز</button>
    <button class="navbtn" data-screen="reports" onclick="showScreen('reports')">📊 التقارير</button>
    <button class="navbtn" data-screen="backup" onclick="showScreen('backup')">💾 النقل والنسخ</button>
  </nav>
</header>

<main id="app"></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="modalbox" class="modalbox"></div></div>
<div id="toast" class="toast"></div>
<div id="celebrate" class="celebrate"></div>
<input id="fileInput" type="file" accept=".xlsx,.xls,.csv" hidden>
<input id="backupInput" type="file" accept=".json" hidden>

<script>
const KEY='behaviorHeroes_nawal_v2';
const SUPABASE_URL='https://mwcwhowbocsfuwijrqfl.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13Y3dob3dib2NzZnV3aWpycWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDYwOTcsImV4cCI6MjEwMzkyMjA5N30.jnAE73ebbekTZ6hWbJMeTvaTz9PgslXxTAMULJx2dGc';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let cloudUser=null, cloudReady=false, cloudTimer=null;
const emojis=['🦊','🐨','🐼','🐯','🦁','🐧','🦉','🐵','🐸','🐰','🐙','🐳'];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
  classes:[{id:id(),name:'الصف الأول أ',students:[]}],
  lessons:[{id:id(),name:'الحصة 1',date:today()}],
  currentClass:null,currentLesson:null,sound:true,
  prizes:[
    {id:id(),name:'نجم اليوم',need:5,icon:'⭐',metric:'stars'},
    {id:id(),name:'بطل السلوك',need:10,icon:'🏆',metric:'stars'},
    {id:id(),name:'سفير السلوك',need:5,icon:'🏅',metric:'good'}
  ]
};
state.currentClass ||= state.classes[0]?.id;
state.currentLesson ||= state.lessons[0]?.id;
// تُحفظ نسخة محلية دائمًا، أما السحابة فتبدأ بعد تسجيل الدخول
localStorage.setItem(KEY,JSON.stringify(state));

// ترقية بيانات النسخ القديمة إلى نظام الجوائز الجديد
state.prizes ||= [];
state.prizes.forEach(p=>{
  if(p.name.includes('سفير السلوك')){p.icon='🏅';p.metric='good';p.need=5;}
  else if(!p.metric){p.metric='stars';}
});
state.classes?.forEach(c=>c.students?.forEach(s=>{studentData(s);s.starLog ||= [];s.homeworkLog ||= []}));
let oldHomeworkPrize=state.prizes.find(p=>p.name==='بطل السلوك');
if(oldHomeworkPrize){oldHomeworkPrize.name='بطل الواجبات';oldHomeworkPrize.icon='📚';oldHomeworkPrize.metric='homework';oldHomeworkPrize.need=5;}
localStorage.setItem(KEY,JSON.stringify(state));

function id(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function today(){return new Date().toLocaleDateString('ar-SA')}
function save(){
 localStorage.setItem(KEY,JSON.stringify(state));
 if(cloudReady && cloudUser){
   clearTimeout(cloudTimer);
   cloudTimer=setTimeout(saveCloud,350);
 }
}
async function saveCloud(){
 if(!cloudReady||!cloudUser)return;
 const {error}=await sb.from('app_state').upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});
 if(error) setAuthMsg('⚠️ تعذر الحفظ السحابي: '+error.message);
 else updateCloudBadge('☁️ تمت المزامنة');
}
function updateCloudBadge(t){const e=document.getElementById('cloudBadge');if(e)e.textContent=t}
function setAuthMsg(t){const e=document.getElementById('authMsg');if(e)e.textContent=t}
async function cloudSignUp(){
 const email=document.getElementById('authEmail').value.trim(), password=document.getElementById('authPassword').value;
 if(!email||password.length<6){setAuthMsg('اكتبي البريد وكلمة مرور من 6 أحرف على الأقل');return}
 setAuthMsg('جارٍ إنشاء الحساب...');
 const {error}=await sb.auth.signUp({email,password});
 if(error)setAuthMsg('❌ '+error.message);else setAuthMsg('✅ تم إنشاء الحساب. إذا طلب التأكيد، افتحي رسالة البريد ثم سجّلي الدخول.');
}
async function cloudSignIn(){
 const email=document.getElementById('authEmail').value.trim(), password=document.getElementById('authPassword').value;
 if(!email||!password){setAuthMsg('أدخلي البريد وكلمة المرور');return}
 setAuthMsg('جارٍ تسجيل الدخول...');
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){setAuthMsg('❌ '+error.message);return}
 await startCloudSession(data.user);
}
async function startCloudSession(user){
 cloudUser=user; setAuthMsg('جارٍ تحميل بياناتك...');
 const {data,error}=await sb.from('app_state').select('data').eq('user_id',user.id).maybeSingle();
 if(error){setAuthMsg('❌ تعذر الوصول إلى البيانات: '+error.message);return}
 if(data?.data){
   state=data.data;
   state.currentClass ||= state.classes?.[0]?.id; state.currentLesson ||= state.lessons?.[0]?.id;
   localStorage.setItem(KEY,JSON.stringify(state));
 } else {
   await saveCloud();
 }
 cloudReady=true;
 document.getElementById('cloudLogin').style.display='none';
 syncControls(); render();
 updateCloudBadge('☁️ متصل');
}
async function cloudSignOut(){await sb.auth.signOut();location.reload()}
async function initCloud(){
 const {data}=await sb.auth.getSession();
 if(data.session) await startCloudSession(data.session.user);
}
sb.auth.onAuthStateChange((_event,session)=>{ if(session&&!cloudReady) startCloudSession(session.user); });
function cls(){return state.classes.find(x=>x.id===state.currentClass)}
function lesson(){return state.lessons.find(x=>x.id===state.currentLesson)}
function studentData(s){s.evals ||= {}; s.stars ||= 0; s.awards ||= []; s.avatar ||= emojis[Math.floor(Math.random()*emojis.length)]; s.starLog ||= []; s.homeworkLog ||= []; return s}
function dateObj(d){let x=new Date(d);return isNaN(x)?null:x}
function weekKey(d=new Date()){
  let x=new Date(d); x.setHours(0,0,0,0);
  let day=x.getDay(); let diff=day===0?-6:1-day; x.setDate(x.getDate()+diff);
  return x.toISOString().slice(0,10);
}
function weekLabel(key){
  let x=new Date(key+'T00:00:00'); let y=new Date(x); y.setDate(x.getDate()+6);
  return `الأسبوع ${x.toLocaleDateString('ar-SA',{day:'numeric',month:'numeric'})} - ${y.toLocaleDateString('ar-SA',{day:'numeric',month:'numeric'})}`;
}
function weekDates(key){
  let x=new Date(key+'T00:00:00'); let a=[];
  for(let i=0;i<7;i++){let d=new Date(x);d.setDate(x.getDate()+i);a.push(d)}
  return a;
}
function starsWeek(s,key=weekKey()){return (s.starLog||[]).filter(x=>weekKey(x.at)===key).reduce((n,x)=>n+(x.n||1),0)}
function homeworkWeek(s,key=weekKey()){return (s.homeworkLog||[]).filter(x=>x.week===key).reduce((n,x)=>n+(x.n||1),0)}
function goodWeek(s,key=weekKey()){
  let n=0; weekDates(key).forEach(d=>{
    let ds=d.toLocaleDateString('ar-SA'); state.lessons.forEach(l=>{
      let ld=dateObj(l.date); if(ld && ld.toLocaleDateString('ar-SA')===ds && s.evals?.[l.id]?.type==='good') n++;
    });
  }); return n;
}
function badWeek(s,key=weekKey()){
  let n=0; weekDates(key).forEach(d=>{
    let ds=d.toLocaleDateString('ar-SA'); state.lessons.forEach(l=>{
      let ld=dateObj(l.date); if(ld && ld.toLocaleDateString('ar-SA')===ds && s.evals?.[l.id]?.type==='bad') n++;
    });
  }); return n;
}
function attendedWeek(s,key=weekKey()){
  return goodWeek(s,key)+badWeek(s,key);
}
function attendanceStatus(s,l){
  let t=s.evals?.[l.id]?.type;
  return t==='absent'?'🚫 غائب':(t==='good'||t==='bad')?'✅ حاضر':'—';
}
function weeklyRows(key=weekKey()){
  let ps=cls()?.students||[];
  // المشاركة 35%، السلوك 35%، الواجبات 30%.
  // عدد الواجبات يختلف من أسبوع لآخر، لذلك لا نفترض واجبًا كل يوم:
  // نعتبر أعلى عدد واجبات مسجل في الأسبوع هو عدد الواجبات المطلوبة لذلك الأسبوع.
  let maxHomework=Math.max(0,...ps.map(s=>homeworkWeek(s,key)));
  return ps.map(s=>{
    let participation=starsWeek(s,key), homework=homeworkWeek(s,key), behavior=goodWeek(s,key), warnings=badWeek(s,key), attended=attendedWeek(s,key);
    let pScore=Math.min(35,participation*7);
    // السلوك: 😊 رائع = +1، ⚠️ تنبيه = -1، 🚫 غائب خارج الحساب.
    // نحسب النتيجة كنسبة من الحصص التي تم تقييمها، ثم من 35 درجة.
    let bScore=attended===0?0:Math.max(0,Math.min(35,((behavior-warnings)/attended)*35));
    let hScore=maxHomework===0?30:Math.min(30,(homework/maxHomework)*30);
    return {s,participation,homework,behavior,warnings,attended,pScore,hScore,bScore,total:Math.round(pScore+hScore+bScore)};
  }).sort((a,b)=>b.total-a.total);
}

function evalKey(){return state.currentLesson}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function syncControls(){
 const cs=document.getElementById('classSelect'),ls=document.getElementById('lessonSelect');
 cs.innerHTML=state.classes.map(c=>`<option value="${c.id}" ${c.id===state.currentClass?'selected':''}>${esc(c.name)}</option>`).join('');
 ls.innerHTML=state.lessons.map(l=>`<option value="${l.id}" ${l.id===state.currentLesson?'selected':''}>${esc(l.name)}</option>`).join('');
 cs.onchange=()=>{state.currentClass=cs.value;save();render()};
 ls.onchange=()=>{state.currentLesson=ls.value;save();render()};
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showScreen(screen){
 document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));
 render(screen)
}
function render(screen='students'){
 syncControls();
 if(screen==='students') renderStudents();
 if(screen==='manage') renderManage();
 if(screen==='honor') renderHonor();
 if(screen==='prizes') renderPrizes();
 if(screen==='reports') renderReports();
 if(screen==='backup') renderBackup();
}
function progress(){
 let c=cls(), total=c?.students.length||0;
 if(!total)return 0;
 let points=c.students.reduce((a,s)=>a+(s.stars||0),0);
 return Math.min(100,Math.round(points/(total*10)*100));
}
function renderStudents(){
 let c=cls(), l=lesson(), ps=c?.students||[];
 const good=ps.filter(s=>s.evals?.[l?.id]?.type==='good').length;
 const bad=ps.filter(s=>s.evals?.[l?.id]?.type==='bad').length;
 const stars=ps.reduce((a,s)=>a+(s.stars||0),0);
 document.getElementById('app').innerHTML=`
 <section class="hero"><div class="heroGrid">
   <div><div class="muted">الفصل الحالي</div><h2>${esc(c?.name||'لا يوجد فصل')}</h2><div class="muted">${esc(l?.name||'')} • ${esc(l?.date||'')}</div></div>
   <div><div class="stats">
      <div class="stat"><b>${ps.length}</b>👥 الطلاب<div class="small muted">ثابت لكل الحصص</div></div>
      <div class="stat"><b>${good}</b>😊 إيجابي<div class="small muted">هذه الحصة</div></div>
      <div class="stat"><b>${stars}</b>⭐ النجوم<div class="small muted">إجمالي الفصل</div></div>
      <div class="stat"><b>${bad}</b>😠 تنبيه<div class="small muted">هذه الحصة</div></div>
    </div>
   <div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-weight:900;margin-bottom:6px"><span>🌟 رحلة أبطال الفصل</span><span>${progress()}%</span></div><div class="progress"><i style="width:${progress()}%"></i></div></div>
   <div class="panel" style="margin:14px 0 0;padding:12px;background:#ffffffaa">
     <div style="font-weight:900;margin-bottom:6px">📖 سجل الحصص — محفوظ ولا يتغير عند الانتقال</div>
     <div style="display:flex;gap:6px;flex-wrap:wrap">${state.lessons.map(ll=>{
       const g=ps.filter(ss=>ss.evals?.[ll.id]?.type==='good').length;
       const b=ps.filter(ss=>ss.evals?.[ll.id]?.type==='bad').length;

     }).join('')}</div>
   </div>
 </div>
 </div></section>
 <div class="panel noPrint"><div style="font-weight:900;margin-bottom:8px">🎯 تقرير السلوك للفصل الحالي: <span style="color:#0b9f9d">${esc(state.currentLesson?lesson()?.name||"": "")}</span></div><div class="toolbar"><input id="search" placeholder="🔎 ابحثي عن طالب"><button class="btn" onclick="openModal('student')">＋ إضافة طالب</button><button class="btn gold" onclick="addStarsToAll()">⭐ نجمة للجميع</button></div></div>
 <div id="studentGrid" class="grid">${ps.length?ps.map(studentCard).join(''):`<div class="empty" style="grid-column:1/-1">أضيفي الطلاب للبدء 🎮</div>`}</div>
 <div class="footer">أبطال السلوك • ✦ تصميم نوال الجهني ✦ • إصدار مطوّر</div>`;
 document.getElementById('search').oninput=e=>filterStudents(e.target.value);
}
function filterStudents(q){document.querySelectorAll('.student').forEach(x=>x.style.display=x.dataset.name.includes(q.trim())?'':'none')}
function studentCard(s){
  studentData(s);
  let e=s.evals?.[evalKey()]||{type:'neutral'};
  let level=getLevel(s.stars||0), pct=Math.min(100,((s.stars||0)%10)*10);
  let status=e.type==='good'?'<span class="statusBadge statusGood">😊 رائع</span>':
             e.type==='bad'?'<span class="statusBadge statusBad">⚠️ تنبيه</span>':
             e.type==='absent'?'<span class="statusBadge statusAbsent">🚫 غائب</span>':
             '<span class="statusBadge statusNeutral">⭕ لم يُقيّم</span>';
  let undo=e.type!=='neutral'?`<button class="btn danger" style="padding:5px 8px" onclick="clearEval('${s.id}')">↩️ حذف التقييم</button>`:'';
  return `<article class="student" data-name="${esc(s.name)}">
    <div class="avatar">${s.avatar}</div><div class="name">${esc(s.name)}</div><div class="level">${level}</div>
    <div class="badgeRow"><span class="badge">⭐ ${s.stars||0}</span>${status}</div>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <div class="actions">
     <button class="face bad" onclick="rate('${s.id}','bad')">⚠️ تنبيه</button>
     <button class="face star" onclick="giveStar('${s.id}')">⭐ نجمة</button>
     <button class="face good" onclick="rate('${s.id}','good')">😊 رائع</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px">
      <button class="face absent" onclick="rate('${s.id}','absent')">🚫 غائب</button>
      ${undo||'<span></span>'}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px">
      <span>تقييم الحصة: ${status}</span>
      <span style="display:flex;gap:5px">
        <button class="btn" style="padding:5px 8px" onclick="editStudent('${s.id}')">تعديل</button>
        ${(s.stars||0)>0?`<button class="btn danger" style="padding:5px 8px" onclick="removeStar('${s.id}')">↩️ حذف نجمة</button>`:''}
      </span>
    </div>
    <div class="history">${historyIcons(s)}</div>
  </article>`
}
function historyIcons(s){
 return state.lessons.map(l=>{let e=s.evals?.[l.id];return `<span class="mini" title="${esc(l.name)}">${e?.type==='good'?'😊':e?.type==='bad'?'😠':e?.type==='absent'?'🚫':'🙂'}</span>`}).join('')
}
function getLevel(n){if(n>=50)return'👑 بطل السلوك';if(n>=30)return'🏅 بطل';if(n>=20)return'🌟 نجم';if(n>=10)return'⭐ متقدم';return'🌱 مبتدئ'}
function rate(sid,type){
  let s=cls().students.find(x=>x.id===sid);studentData(s);
  s.evals[evalKey()]={type,at:new Date().toISOString()};
  save();
  if(type==='good'){beep('good');toast('👏 أحسنت! سلوك رائع');checkAmbassador(s)}
  else if(type==='bad'){beep('bad');toast('🔔 تم تسجيل تنبيه خفيف')}
  else {beep('absent');toast('🚫 تم تسجيل الغياب')}
  renderStudents();checkGroup();
}
function clearEval(sid){
  let s=cls().students.find(x=>x.id===sid); if(!s)return;
  if(confirm('حذف تقييم الطالب لهذه الحصة؟')){delete s.evals[evalKey()];save();renderStudents();toast('↩️ تم حذف التقييم')}
}
function giveStar(sid){
  let s=cls().students.find(x=>x.id===sid);studentData(s);s.stars=(s.stars||0)+1;s.starLog.push({at:new Date().toISOString(),n:1,lesson:evalKey()});
  save();beep('star');toast(`⭐ أضيفت نجمة لـ ${s.name}`);confetti('⭐','🌟','✨');renderStudents();checkPrize(s);
}
function giveHomework(sid){
  let s=cls().students.find(x=>x.id===sid); if(!s)return; studentData(s);
  s.homeworkLog.push({at:new Date().toISOString(),week:weekKey(),n:1});
  save(); beep('star'); toast(`📚 سُجل واجب لـ ${s.name}`); confetti('📚','✨'); renderStudents();
}
function removeHomework(sid){
  let s=cls().students.find(x=>x.id===sid); if(!s||!s.homeworkLog?.length)return;
  let k=weekKey(),i=s.homeworkLog.map(x=>x.week).lastIndexOf(k); if(i<0)return toast('لا يوجد واجب مسجل هذا الأسبوع');
  if(confirm(`حذف واجب مسجل لـ ${s.name}؟`)){s.homeworkLog.splice(i,1);save();renderStudents();toast('↩️ تم حذف الواجب')}
}
function removeStar(sid){
  let s=cls().students.find(x=>x.id===sid); if(!s || !(s.stars>0))return;
  if(confirm(`حذف نجمة من ${s.name}؟`)){s.stars--;save();renderStudents();toast('↩️ تم حذف نجمة')}
}
function addStarsToAll(){
  cls().students.forEach(s=>{studentData(s);s.stars=(s.stars||0)+1});
  save();beep('star');toast('⭐ أضيفت نجمة لكل أبطال الفصل');renderStudents();checkGroup();
}
function checkGroup(){if(progress()>=100){beep('win');toast('🎉 أكمل الفصل الهدف الجماعي!');confetti('🎉','🏆','⭐','✨')}}
function goodCount(s){
  return state.lessons.reduce((n,l)=>n+(s.evals?.[l.id]?.type==='good'?1:0),0);
}
function checkAmbassador(s){
  let p=state.prizes.find(x=>x.name.includes('سفير السلوك'));
  if(!p)return;
  if(goodCount(s)>=p.need && !(s.awards||[]).includes(p.id)){
    s.awards ||= []; s.awards.push(p.id); save();
    beep('win');toast(`🏅 ${s.name} أصبح سفير السلوك!`);confetti('🏅','👑','✨','🎉');
  }
}
function prizeProgress(s,p){
  return (p.name.includes('سفير السلوك')||p.metric==='good')?goodCount(s):(p.metric==='homework'||p.name.includes('الواجبات'))?homeworkWeek(s): (s.stars||0);
}
function checkPrize(s){
  state.prizes.forEach(p=>{
    if(p.name.includes('سفير السلوك')||p.metric==='good'||p.metric==='homework'||p.name.includes('الواجبات')) return;
    if(prizeProgress(s,p)>=p.need && !(s.awards||[]).includes(p.id)){
      s.awards ||= []; s.awards.push(p.id);save();beep('win');
      toast(`🏆 ${s.name} حصل على ${p.name}`);confetti('🏆','🎁','⭐');
    }
  });
}
function awardPrizeToStudent(prizeId,sid){
  let p=state.prizes.find(x=>x.id===prizeId), s=cls().students.find(x=>x.id===sid);
  if(!p||!s)return;
  s.awards ||= [];
  if(!s.awards.includes(p.id)){s.awards.push(p.id);save();beep('win');toast(`🎁 تم منح ${p.name} لـ ${s.name}`);confetti(p.icon,'🎉','✨');}
  else toast('هذه الجائزة مسجلة للطالب بالفعل');
  renderPrizes();
}
function removeAwardFromStudent(prizeId,sid){
  let s=cls().students.find(x=>x.id===sid); if(!s)return;
  s.awards=(s.awards||[]).filter(x=>x!==prizeId);save();renderPrizes();toast('↩️ تم إلغاء الجائزة');
}

function openModalHTML(x){document.getElementById('modalbox').innerHTML=x;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function addStudent(){let n=document.getElementById('mName').value.trim();if(!n)return toast('اكتبي اسم الطالب');if(cls().students.some(s=>s.name.trim()===n))return toast('هذا الاسم موجود بالفعل');cls().students.push({id:id(),name:n,avatar:document.getElementById('mAvatar').value,stars:0,evals:{},awards:[]});save();closeModal();renderStudents()}
function addClass(){let n=document.getElementById('mName').value.trim();if(!n)return;let c={id:id(),name:n,students:[]};state.classes.push(c);state.currentClass=c.id;save();closeModal();syncControls();renderManage()}
function addLesson(){let n=document.getElementById('mName').value.trim();if(!n)return;let l={id:id(),name:n,date:document.getElementById('mDate').value||today()};state.lessons.push(l);state.currentLesson=l.id;save();closeModal();syncControls();renderStudents()}
function addPrize(){let n=document.getElementById('mName').value.trim();let need=Math.max(1,+document.getElementById('mNeed').value||1);let icon=document.getElementById('mIcon').value||'🏆';let metric=document.getElementById('mMetric').value||'stars';if(!n)return;state.prizes.push({id:id(),name:n,need,icon,metric});save();closeModal();renderPrizes()}
function importExcel(){
 document.getElementById('fileInput').click();

document.getElementById('fileInput').addEventListener('change',async e=>{
 let f=e.target.files[0];if(!f)return;
 try{
  let data=await f.arrayBuffer(), wb=window.XLSX?XLSX.read(data,{type:'array'}):null;
  if(!wb)throw new Error('XLSX');
  let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  let names=rows.flat().map(x=>String(x).trim()).filter(x=>x.length>1);
  names=[...new Set(names)].filter(n=>!cls().students.some(s=>s.name.trim()===n));
  openModalHTML(`<h3>📥 معاينة الاستيراد</h3><p>سيتم استيراد <b>${names.length}</b> اسمًا إلى <b>${esc(cls().name)}</b>.</p><div style="max-height:300px;overflow:auto;background:#f7fbfd;padding:10px;border-radius:12px">${names.map(n=>`<div>• ${esc(n)}</div>`).join('')}</div><br><button class="btn primary" onclick='confirmImport(${JSON.stringify(names)})'>استيراد الأسماء</button>`);
 }catch(err){toast('تعذر قراءة الملف. جرّبي XLSX أو CSV.')}
 e.target.value='';
});
function confirmImport(names){names.forEach(n=>cls().students.push({id:id(),name:n,avatar:emojis[Math.floor(Math.random()*emojis.length)],stars:0,evals:{},awards:[]}));save();closeModal();renderManage();toast(`تم استيراد ${names.length} طالبًا`)}
function exportStudents(){
 let c=cls(), data=c.students.map(s=>({الاسم:s.name,النجوم:s.stars||0,المستوى:getLevel(s.stars||0),...Object.fromEntries(state.lessons.map(l=>[l.name,s.evals?.[l.id]?.type==='good'?'إيجابي':s.evals?.[l.id]?.type==='bad'?'تنبيه':'']))}));

document.getElementById('backupInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.classes||!x.lessons)throw 0;if(confirm('استبدال البيانات الحالية بالنسخة الاحتياطية؟')){state=x;save();syncControls();showScreen('students');toast('تم استيراد النسخة الاحتياطية')}}catch{toast('ملف النسخة الاحتياطية غير صالح')}e.target.value=''})
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
let audioCtx;
function beep(kind){
  if(!state.sound)return;
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    if(kind==='star'){
      // نجمة: نغمة صاعدة قصيرة
      [880,1175,1480].forEach((f,i)=>{
        let o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(.0001,now+i*.08);g.gain.exponentialRampToValueAtTime(.11,now+i*.08+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.08+.16);
        o.start(now+i*.08);o.stop(now+i*.08+.18);
      });
      return;
    }
    if(kind==='good'||kind==='win'){
      // تصفيق اصطناعي من نبضات ضوضاء قصيرة + نغمة احتفال
      const duration=kind==='win'?0.9:0.55;
      for(let i=0;i<(kind==='win'?9:6);i++){
        const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*.045,audioCtx.sampleRate);
        const data=buffer.getChannelData(0);
        for(let j=0;j<data.length;j++) data[j]=(Math.random()*2-1)*(1-j/data.length);
        const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
        src.buffer=buffer;filter.type='bandpass';filter.frequency.value=1700;filter.Q.value=0.7;
        src.connect(filter);filter.connect(g);g.connect(audioCtx.destination);
        const t=now+i*(duration/(kind==='win'?9:6));
        g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.045);
        src.start(t);src.stop(t+.05);
      }
      if(kind==='win'){
        [660,880,1047].forEach((f,i)=>{
          let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='triangle';o.frequency.value=f;
          g.gain.setValueAtTime(.0001,now+.15+i*.12);g.gain.exponentialRampToValueAtTime(.09,now+.17+i*.12);g.gain.exponentialRampToValueAtTime(.0001,now+.36+i*.12);
          o.start(now+.15+i*.12);o.stop(now+.38+i*.12);
        });
      }
      return;
    }
    let o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=kind==='bad'?280:kind==='absent'?220:990;o.type='sine';
    g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.08,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.22);
    o.start(now);o.stop(now+.24);
  }catch{}
}
